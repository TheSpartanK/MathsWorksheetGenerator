<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Math Worksheet & Interactive Test Generator</title>
        <!-- Link to external modular style configuration properties sheet -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <!-- Settings Panel (Hidden during Print) -->
            <div class="controls">
                <h1>Worksheet Generator Settings</h1>

                <div class="control-row">
                    <label><strong>Total Questions:</strong></label>
                    <input type="number" id="totalQuestions" class="input-num" value="24" min="1" max="100">
                </div>
                
                <!-- Select controls placed right above the dynamic question configuration lists -->
                <h3>Select Formats to Include</h3>
                <div class="bulk-actions" style="margin-bottom: 15px; display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="setAllCheckboxes(true)">✅ Select All</button>
                    <button class="btn btn-secondary" onclick="setAllCheckboxes(false)">❌ Unselect All</button>
                    <button class="btn btn-secondary" onclick="resetToSystemDefaults()">🔄 Reset to Defaults</button>
                </div>

                <!-- Target container for dynamic settings checkboxes -->
                <div id="checkboxesContainer"></div>

                <div class="main-actions">
                    <button class="btn" onclick="generateWorksheet()">⚡ Generate Preview</button>
                    <button class="btn" style="background-color: #ff9900;" onclick="generateInteractiveTest()">📝 Start Interactive Test</button>
                    <button class="btn" style="background-color: #34a853;" onclick="window.print()">🖨️ Print Worksheet</button>
                </div>
            </div>

            <!-- Live Paper Preview Header -->
            <div class="worksheet-header" id="worksheetHeader">
                <div><strong>Name:</strong> ___________________________</div>
                <div><strong>Date:</strong> ___________________________</div>
                <div><strong>Score:</strong> _________</div>
            </div>

                    <!-- Dynamic Output Containers -->
            <div id="worksheetGrid" class="grid"></div>

            <div id="testSummaryPlaceholder"></div>

            <!-- Unified Interactive Exam Layout Wrapper -->
            <div id="interactiveTestWrapper" style="display: none; flex-direction: column; gap: 20px; margin-top: 20px;">
                <div id="masteredQuestionsContainer" style="display: none; opacity: 0.7;"></div>
                <div id="testContainer" class="test-list"></div>
                <div id="testActionsRow" style="display: flex; gap: 15px; margin-top: 10px;"></div>
            </div>

            <div id="answerKeyContainer"></div>


        </div>

        <!-- 1. Load data models first to register the questionTypes source collection array -->
        <script src="questions.js"></script>

        <!-- 2. Load operational lifecycle engines second to bind UI nodes to cached global arrays -->
        <script src="script.js"></script>
    </body>
</html>
